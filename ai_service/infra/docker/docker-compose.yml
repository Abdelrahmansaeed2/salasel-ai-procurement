services:
  app:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    env_file:
      - ../../.env.example
    environment:
      DATABASE_URL: mssql+aioodbc://sa:YourStrong%21Passw0rd@sqlserver:1433/SalaselAiService?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: YourStrong!Passw0rd
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -C -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - sqlserver-data:/var/opt/mssql

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./init-db.sql:/work/init-db.sql:ro
      - ./seed.sql:/work/seed.sql:ro
    command: >
      /bin/bash -c "/opt/mssql-tools18/bin/sqlcmd
      -S sqlserver -U sa -P 'YourStrong!Passw0rd' -C
      -i /work/init-db.sql"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sqlserver-data:
