[project]
name = "ai-service"
version = "0.1.0"
description = "AI service for Salasel procurement supplier matching"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aioodbc>=0.5.0",
    "alembic>=1.13.2",
    "fastapi>=0.111.0",
    "pydantic-settings>=2.4.0",
    "pyodbc>=5.1.0",
    "redis>=5.0.7",
    "sqlalchemy>=2.0.31",
    "uvicorn[standard]>=0.30.1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
]

[project.scripts]
ai-service = "main:main"

[tool.setuptools.packages.find]
include = ["app*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
