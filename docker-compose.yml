services:

  # ─────────────────────────────────────────────────────────────────
  #  SQL Server 2022
  # ─────────────────────────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: salasel-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${DB_PASSWORD}"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL",
        "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -Q 'SELECT 1' -C -No || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  # ─────────────────────────────────────────────────────────────────
  #  Seq  (structured log viewer — UI at :8080)
  # ─────────────────────────────────────────────────────────────────
  seq:
    image: datalust/seq:latest
    container_name: salasel-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: "${SEQ_PASSWORD}"
    ports:
      - "5342:80"     # UI and Ingestion
    volumes:
      - seq_data:/data

  # ─────────────────────────────────────────────────────────────────
  #  Salasel API  (image pulled from Docker Hub by CI/CD)
  # ─────────────────────────────────────────────────────────────────
  api:
    image: ${DOCKER_IMAGE:-abdelrahmansaeed369/salasel-api}:${IMAGE_TAG:-latest}
    container_name: salasel-api
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
      seq:
        condition: service_started
    ports:
      - "5000:80"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:80"

      ConnectionStrings__DefaultConnection: >-
        Server=sqlserver,1433;Database=${DB_NAME:-SalaselDb};User Id=sa;
        Password=${DB_PASSWORD};MultipleActiveResultSets=true;TrustServerCertificate=True;

      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "Salasel.API"
      Jwt__Audience: "Salasel.App"

      Seq__Url: "http://seq:5341"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s


  # ─────────────────────────────────────────────────────────────────
  #  AI Service Dependencies
  # ─────────────────────────────────────────────────────────────────
  redis:
    image: redis/redis-stack-server:latest
    container_name: salasel-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: salasel-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage


  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: salasel-sqlserver-init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./ai_service/infra/docker/init-db.sql:/work/init-db.sql:ro
      - ./ai_service/infra/docker/seed.sql:/work/seed.sql:ro
    command: >
      /bin/bash -c "/opt/mssql-tools18/bin/sqlcmd
      -S sqlserver -U sa -P '${DB_PASSWORD}' -C
      -i /work/init-db.sql"
    environment:
      DB_PASSWORD: "${DB_PASSWORD}"

  # ─────────────────────────────────────────────────────────────────
  #  Salasel AI Service
  # ─────────────────────────────────────────────────────────────────
  ai-service:
    build:
      context: ./ai_service
      dockerfile: infra/docker/Dockerfile
    container_name: salasel-ai-service
    env_file:
      - .env
    environment:
      DATABASE_URL: "mssql+aioodbc://sa:${DB_PASSWORD}@sqlserver:1433/SalaselAiService?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"
      REDIS_URL: "redis://redis:6379/0"
      QDRANT_URL: "http://qdrant:6333"
    ports:
      - "8000:8000"
    volumes:
      - ./ai_service/app:/app/app
      - ./ai_service/main.py:/app/main.py
      - ./ai_service/alembic.ini:/app/alembic.ini
      - ./ai_service/pyproject.toml:/app/pyproject.toml
      - ./ai_service/infra/docker/seed.sql:/work/seed.sql:ro
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

volumes:
  sqlserver_data:
    name: salasel_sqlserver_data
  seq_data:
    name: salasel_seq_data
  qdrant_data:
    name: salasel_qdrant_data
