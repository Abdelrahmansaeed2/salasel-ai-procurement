services:

  # ─────────────────────────────────────────────────────────────────
  #  SQL Server
  # ─────────────────────────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: salasel-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${DB_PASSWORD:-Sls3l_DB#2026!Secure@Vault91}"
      MSSQL_PID: "Express"          # free tier; change to Developer or Standard if needed
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost",
             "-U", "sa", "-P", "${DB_PASSWORD:-Sls3l_DB#2026!Secure@Vault91}",
             "-Q", "SELECT 1", "-C", "-No"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ─────────────────────────────────────────────────────────────────
  #  Seq  (structured log viewer)
  # ─────────────────────────────────────────────────────────────────
  seq:
    image: datalust/seq:latest
    container_name: salasel-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:5341"   # ingestion
      - "8080:80"     # UI  →  http://localhost:8080
    volumes:
      - seq_data:/data

  # ─────────────────────────────────────────────────────────────────
  #  Salasel API
  # ─────────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend-dotnet
      dockerfile: Dockerfile
    image: salasel-api:local
    container_name: salasel-api
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
      seq:
        condition: service_started
    ports:
      - "5000:80"     # API  →  http://localhost:5000
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ASPNETCORE_URLS: "http://+:80"

      # Database
      ConnectionStrings__DefaultConnection: >-
        Server=sqlserver,1433;
        Database=${DB_NAME:-SalaselDb};
        User Id=sa;
        Password=${DB_PASSWORD:-Sls3l_DB#2026!Secure@Vault91};
        MultipleActiveResultSets=true;
        TrustServerCertificate=True;

      # JWT
      Jwt__Key: "${JWT_KEY:-SalaselSuperSecretKeyThatIsAtLeast32BytesLong!!!123}"
      Jwt__Issuer: "Salasel.API"
      Jwt__Audience: "Salasel.App"

      # Seq  (internal docker network)
      Seq__Url: "http://seq:5341"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  sqlserver_data:
    name: salasel_sqlserver_data
  seq_data:
    name: salasel_seq_data
