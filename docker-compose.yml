services:

  # ─────────────────────────────────────────────────────────────────
  #  SQL Server 2022
  # ─────────────────────────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: salasel-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${DB_PASSWORD}"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL",
        "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -Q 'SELECT 1' -C -No || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  # ─────────────────────────────────────────────────────────────────
  #  Seq  (structured log viewer — UI at :8080)
  # ─────────────────────────────────────────────────────────────────
  seq:
    image: datalust/seq:latest
    container_name: salasel-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: "${SEQ_PASSWORD}"
    ports:
      - "5342:80"     # UI and Ingestion
    volumes:
      - seq_data:/data

  # ─────────────────────────────────────────────────────────────────
  #  Salasel API  (image pulled from Docker Hub by CI/CD)
  # ─────────────────────────────────────────────────────────────────
  api:
    image: ${DOCKER_IMAGE:-abdelrahmansaeed369/salasel-api}:${IMAGE_TAG:-latest}
    container_name: salasel-api
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
      seq:
        condition: service_started
    ports:
      - "5000:80"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:80"

      ConnectionStrings__DefaultConnection: >-
        Server=sqlserver,1433;Database=${DB_NAME:-SalaselDb};User Id=sa;
        Password=${DB_PASSWORD};MultipleActiveResultSets=true;TrustServerCertificate=True;

      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "Salasel.API"
      Jwt__Audience: "Salasel.App"

      Seq__Url: "http://seq:5341"
      AiService__BaseUrl: "http://ai_service:8000"
      AiService__TimeoutSeconds: "120"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────────────────────────
  #  Redis  (ai_service state store / ephemeral cache)
  # ─────────────────────────────────────────────────────────────────
  redis:
    image: redis/redis-stack-server:latest
    container_name: salasel-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────────
  #  Qdrant  (ai_service vector DB)
  # ─────────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: salasel-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333 && echo -e 'GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q 200 <&3"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────────────────────────
  #  AI service  (FastAPI + LangGraph)
  # ─────────────────────────────────────────────────────────────────
  ai_service:
    image: ${AI_DOCKER_IMAGE:-abdelrahmansaeed369/salasel-ai-service}:${IMAGE_TAG:-latest}
    container_name: salasel-ai
    restart: unless-stopped
    environment:
      APP_ENV: production
      SEED_ON_STARTUP: "true"
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      LLM_PROVIDER: groq
      STT_PROVIDER: groq
      LLM_GROQ_API_KEY: "${LLM_GROQ_API_KEY}"
      LLM_ANTHROPIC_API_KEY: "${LLM_ANTHROPIC_API_KEY}"
      STT_API_KEY: "${STT_API_KEY}"
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

volumes:
  sqlserver_data:
    name: salasel_sqlserver_data
  seq_data:
    name: salasel_seq_data
  qdrant_data:
    name: salasel_qdrant_data
