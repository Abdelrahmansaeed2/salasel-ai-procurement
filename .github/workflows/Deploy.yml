name: Deploy Salasel API

on:
  push:
    branches:
      - main

env:
  DOCKER_IMAGE: abdelrahmansaeed369/salasel-api

jobs:
  # ── Build & Push Docker Image ───────────────────────────────────────
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: toor
          port: 6967
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 10m
          script: |
            sudo chmod +x /opt/backend-dotnet/backend-dotnet/deploy.sh
            sudo bash /opt/backend-dotnet/backend-dotnet/deploy.sh
