name: Deploy Salasel API

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: toor
          port: 6967
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 30m
          script: |
            sudo chmod +x /opt/backend-dotnet/backend-dotnet/deploy.sh
            sudo bash /opt/backend-dotnet/backend-dotnet/deploy.sh
