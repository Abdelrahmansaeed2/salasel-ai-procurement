name: Deploy Salasel API

on:
  push:
    branches:
      - main

env:
  DOCKER_IMAGE: abdelrahmansaeed369/salasel-api

jobs:
  # ── Build & Push Docker Image ───────────────────────────────────────
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend-dotnet
          dockerfile: ./backend-dotnet/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy on VPS via docker compose ───────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout (for docker-compose.yml)
        uses: actions/checkout@v4

      - name: Prep VPS folders (Fix Permissions)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: toor
          port: 6967
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 5m
          script: |
            sudo mkdir -p /opt/salasel
            sudo chown -R toor:toor /opt/salasel

      - name: Copy docker-compose.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: toor
          port: 6967
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "docker-compose.yml"
          target: "/opt/salasel/"

      - name: Deploy via docker compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: toor
          port: 6967
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 10m
          script: |
            cd /opt/salasel

            # Update or append IMAGE_TAG in .env securely
            IMAGE_TAG=sha-$(echo ${{ github.sha }} | cut -c1-7)
            if grep -q "^IMAGE_TAG=" .env; then
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" .env
            else
              echo "IMAGE_TAG=${IMAGE_TAG}" >> .env
            fi

            docker compose pull api
            docker compose up -d --remove-orphans

            # Wait for API to be healthy
            echo "Waiting for API to be healthy..."
            timeout 60 bash -c 'until docker inspect salasel-api --format "{{.State.Health.Status}}" | grep -q "healthy"; do sleep 5; done'

            echo "✅ Deployed successfully!"
            docker compose ps
