name: Deploy Salasel API

on:
  push:
    branches:
      - main

env:
  DOCKER_IMAGE: abdelrahmansaeed369/salasel-api
  AI_DOCKER_IMAGE: abdelrahmansaeed369/salasel-ai-service

jobs:
  # ── Build & Push Docker Image ───────────────────────────────────────
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push auto-generated migrations back to repo

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Auto-generate missing EF Core migrations
        run: |
          dotnet tool install --global dotnet-ef --version "10.*"
          cd backend-dotnet
          dotnet restore
          
          # Attempt to add a migration. If models didn't change, no new files are created.
          dotnet ef migrations add AutoMigration_${{ github.run_id }} -p Salasel.Infrastructure -s Salasel.API || echo "No changes or migration failed."
          
          # If git status shows new untracked/modified files in Migrations, it means a migration was generated!
          if [[ -n $(git status --porcelain) ]]; then
            echo "Pending model changes detected! Auto-generating and pushing new migration..."
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "chore: auto-generate missing EF Core migration [skip ci]"
            git push
          else
            echo "No pending model changes detected. Database is up to date."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend-dotnet
          file: ./backend-dotnet/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract AI image metadata
        id: meta_ai
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.AI_DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push AI Service
        uses: docker/build-push-action@v6
        with:
          context: ./ai_service
          file: ./ai_service/infra/docker/Dockerfile
          push: true
          tags: ${{ steps.meta_ai.outputs.tags }}
          labels: ${{ steps.meta_ai.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy on VPS via docker compose ───────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout (for docker-compose.yml)
        uses: actions/checkout@v4


      - name: Prep VPS folders (Fix Permissions)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: toor
          port: 6967
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 5m
          script: |
            sudo mkdir -p /opt/salasel
            sudo chown -R toor:toor /opt/salasel


      - name: Copy docker-compose.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: toor
          port: 6967
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "docker-compose.yml"
          target: "/opt/salasel/"

      - name: Deploy via docker compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: toor
          port: 6967
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 10m
          script: |
            cd /opt/salasel


            # Ensure .env exists
            sudo touch .env
            sudo chown toor:toor .env

            # Inject missing secrets
            if ! grep -q "^DB_PASSWORD=" .env; then
              echo "DB_PASSWORD='${{ secrets.DB_PASSWORD }}'" | sudo tee -a .env
            fi
            if ! grep -q "^DB_NAME=" .env; then
              echo "DB_NAME=SalaselDb" | sudo tee -a .env
            fi
            if ! grep -q "^JWT_KEY=" .env; then
              echo "JWT_KEY='${{ secrets.JWT_KEY }}'" | sudo tee -a .env
            fi
            if ! grep -q "^SEQ_PASSWORD=" .env; then
              echo "SEQ_PASSWORD='${{ secrets.SEQ_PASSWORD }}'" | sudo tee -a .env
            fi
            # Inject or update AI secrets securely
            if grep -q "^LLM_GROQ_API_KEY=" .env; then
              sed -i "s|^LLM_GROQ_API_KEY=.*|LLM_GROQ_API_KEY='${{ secrets.LLM_GROQ_API_KEY }}'|" .env
            else
              echo "LLM_GROQ_API_KEY='${{ secrets.LLM_GROQ_API_KEY }}'" >> .env
            fi
            
            if grep -q "^LLM_ANTHROPIC_API_KEY=" .env; then
              sed -i "s|^LLM_ANTHROPIC_API_KEY=.*|LLM_ANTHROPIC_API_KEY='${{ secrets.LLM_ANTHROPIC_API_KEY }}'|" .env
            else
              echo "LLM_ANTHROPIC_API_KEY='${{ secrets.LLM_ANTHROPIC_API_KEY }}'" >> .env
            fi
            
            if grep -q "^STT_API_KEY=" .env; then
              sed -i "s|^STT_API_KEY=.*|STT_API_KEY='${{ secrets.STT_API_KEY }}'|" .env
            else
              echo "STT_API_KEY='${{ secrets.STT_API_KEY }}'" >> .env
            fi

            # Update or append IMAGE_TAG in .env securely
            IMAGE_TAG=sha-$(echo ${{ github.sha }} | cut -c1-7)
            if grep -q "^IMAGE_TAG=" .env; then
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" .env
            else
              echo "IMAGE_TAG=${IMAGE_TAG}" >> .env
            fi


            sudo docker compose pull api ai_service
            sudo docker compose up -d --remove-orphans

            # Wait for API to be healthy
            echo "Waiting for API to be healthy..."
            timeout 180 bash -c 'until sudo docker inspect salasel-api --format "{{.State.Health.Status}}" | grep -q "healthy"; do sleep 5; done' || {
              echo "Health check timed out! Container logs:"
              sudo docker compose logs api
              exit 1
            }

            echo "✅ Deployed successfully!"
            sudo docker compose ps
