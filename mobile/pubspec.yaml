name: mobile
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  country_picker: ^2.0.28
  get: ^4.6.6
  shared_preferences: ^2.2.3
  permission_handler: ^12.0.3
  dio: ^5.11.0
  flutter_secure_storage: ^10.3.1
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  geolocator: ^14.0.2
  record: ^6.2.1
  path_provider: ^2.1.5

  flutter_screenutil: any
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/salasel_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
