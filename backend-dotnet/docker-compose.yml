services:

  # ─────────────────────────────────────────────────────────────────
  #  SQL Server 2022
  # ─────────────────────────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: salasel-dev-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${DB_PASSWORD:-Your_Strong_Passw0rd}"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL",
        "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -Q 'SELECT 1' -C -No || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  # ─────────────────────────────────────────────────────────────────
  #  Seq  (structured log viewer — UI at :8080)
  # ─────────────────────────────────────────────────────────────────
  seq:
    image: datalust/seq:latest
    container_name: salasel-dev-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: "${SEQ_PASSWORD:-SeqAdmin_Passw0rd}"
    ports:
      - "5342:80"
    volumes:
      - seq_data:/data

  # ─────────────────────────────────────────────────────────────────
  #  Salasel API  (built locally from backend-dotnet/Dockerfile)
  # ─────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: salasel-dev-api
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
      seq:
        condition: service_started
    ports:
      - "5000:80"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:80"

      ConnectionStrings__DefaultConnection: >-
        Server=sqlserver,1433;Database=${DB_NAME:-SalaselDb};User Id=sa;
        Password=${DB_PASSWORD:-Your_Strong_Passw0rd};MultipleActiveResultSets=true;
        TrustServerCertificate=True;

      Jwt__Key: "${JWT_KEY:-Dev_Jwt_Key_Change_Me_At_Least_32_Chars_Long!}"
      Jwt__Issuer: "Salasel.API"
      Jwt__Audience: "Salasel.App"

      Seq__Url: "http://seq:80"

      AiService__BaseUrl: "${AI_SERVICE_URL:-http://ai_service:8000}"
      AiService__TimeoutSeconds: "${AI_SERVICE_TIMEOUT:-120}"

  # ─────────────────────────────────────────────────────────────────
  #  Redis  (ai_service state store / ephemeral cache)
  # ─────────────────────────────────────────────────────────────────
  redis:
    image: redis/redis-stack-server:latest
    container_name: salasel-dev-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─────────────────────────────────────────────────────────────────
  #  Qdrant  (ai_service vector DB — UI/API on :6333)
  # ─────────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: salasel-dev-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333 && echo -e 'GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q 200 <&3"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─────────────────────────────────────────────────────────────────
  #  AI service  (FastAPI + LangGraph, built from ../ai_service)
  # ─────────────────────────────────────────────────────────────────
  ai_service:
    build:
      context: ../ai_service
      dockerfile: infra/docker/Dockerfile
    container_name: salasel-dev-ai
    restart: unless-stopped
    env_file:
      - ../ai_service/.env.example
    environment:
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

volumes:
  sqlserver_data:
    name: salasel_dev_sqlserver_data
  seq_data:
    name: salasel_dev_seq_data
  qdrant_data:
    name: salasel_dev_qdrant_data
