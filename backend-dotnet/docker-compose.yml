services:

  # ─────────────────────────────────────────────────────────────────
  #  SQL Server 2022
  # ─────────────────────────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: salasel-dev-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${DB_PASSWORD:-Your_Strong_Passw0rd}"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL",
        "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -Q 'SELECT 1' -C -No || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  # ─────────────────────────────────────────────────────────────────
  #  Seq  (structured log viewer — UI at :8080)
  # ─────────────────────────────────────────────────────────────────
  seq:
    image: datalust/seq:latest
    container_name: salasel-dev-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: "${SEQ_PASSWORD:-SeqAdmin_Passw0rd}"
    ports:
      - "5342:80"
    volumes:
      - seq_data:/data

  # ─────────────────────────────────────────────────────────────────
  #  Salasel API  (built locally from backend-dotnet/Dockerfile)
  # ─────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: salasel-dev-api
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
      seq:
        condition: service_started
    ports:
      - "5000:80"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:80"

      ConnectionStrings__DefaultConnection: >-
        Server=sqlserver,1433;Database=${DB_NAME:-SalaselDb};User Id=sa;
        Password=${DB_PASSWORD:-Your_Strong_Passw0rd};MultipleActiveResultSets=true;
        TrustServerCertificate=True;

      Jwt__Key: "${JWT_KEY:-Dev_Jwt_Key_Change_Me_At_Least_32_Chars_Long!}"
      Jwt__Issuer: "Salasel.API"
      Jwt__Audience: "Salasel.App"

      Seq__Url: "http://seq:80"

volumes:
  sqlserver_data:
    name: salasel_dev_sqlserver_data
  seq_data:
    name: salasel_dev_seq_data
