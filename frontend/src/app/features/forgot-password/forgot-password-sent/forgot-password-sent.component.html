<app-dashboard-topbar />

<main class="fp-sent-page">
  <div class="fp-sent-card">
    <div class="fp-sent-card__illustration">
      <img
        src="https://api.builder.io/api/v1/image/assets/TEMP/a4f30b9672cb430b6f6a7a91708fd00a25b4fc63?width=448"
        alt="تحقق من بريدك الإلكتروني"
      />
    </div>

    <div class="fp-sent-card__content">
      <h1 class="fp-sent-card__title">تحقق من بريدك الإلكتروني</h1>
      <div class="fp-sent-card__text-wrap">
        <p class="fp-sent-card__text">
          لقد أرسلنا رابطًا آمنًا لإعادة تعيين كلمة المرور إلى بريدك الإلكتروني. يرجى التحقق من صندوق الوارد (أو مجلد
          البريد العشوائي).
        </p>
      </div>
    </div>

    <div class="fp-sent-card__actions">
      <button type="button" class="fp-sent-card__btn fp-sent-card__btn--primary" (click)="openMailApp()">
        فتح تطبيق البريد
      </button>

      <div class="fp-sent-card__resend">
        <button
          type="button"
          class="fp-sent-card__btn fp-sent-card__btn--secondary"
          [disabled]="!canResend()"
          (click)="resendEmail()"
        >
          إعادة إرسال البريد
        </button>

        @if (!canResend()) {
          <p class="fp-sent-card__countdown">
            <span class="fp-sent-card__countdown-value">{{ formattedCountdown() }}</span>
            <span>يمكنك إعادة الإرسال خلال</span>
          </p>
        }
      </div>

      <a routerLink="/supplier-login" class="fp-sent-card__back-link">العودة لتسجيل الدخول</a>
    </div>
  </div>
</main>
