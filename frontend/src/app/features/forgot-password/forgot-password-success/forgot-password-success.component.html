<app-dashboard-topbar />

<main class="fp-success-page">
  <div class="fp-success-card">
    <div class="fp-success-card__illustration">
      <img
        src="https://api.builder.io/api/v1/image/assets/TEMP/66ed9ecac94a20635e2a64a76f66617187ffcd1c?width=512"
        alt="تم تحديث كلمة المرور بنجاح"
      />
    </div>

    <div class="fp-success-card__content">
      <h1 class="fp-success-card__title">تم تحديث كلمة المرور بنجاح</h1>
      <div class="fp-success-card__text-wrap">
        <p class="fp-success-card__text">
          يمكنك الآن استخدام كلمة المرور الجديدة للوصول إلى حسابك في بوابة الموردين. يرجى الحفاظ على سرية بياناتك.
        </p>
      </div>
    </div>

    <div class="fp-success-card__actions">
      <a routerLink="/supplier-login" class="fp-success-card__btn fp-success-card__btn--primary">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 18V16H16V2H9V0H16C16.55 0 17.0208 0.195833 17.4125 0.5875C17.8042 0.979167 18 1.45 18 2V16C18 16.55 17.8042 17.0208 17.4125 17.4125C17.0208 17.8042 16.55 18 16 18H9ZM7 14L5.625 12.55L8.175 10H0V8H8.175L5.625 5.45L7 4L12 9L7 14Z" fill="white"/>
        </svg>
        <span>الذهاب إلى تسجيل الدخول</span>
      </a>

      <a routerLink="/supplier-dashboard" class="fp-success-card__btn fp-success-card__btn--secondary">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 6V0H18V6H10ZM0 10V0H8V10H0ZM10 18V8H18V18H10ZM0 18V12H8V18H0ZM2 8H6V2H2V8ZM12 16H16V10H12V16ZM12 4H16V2H12V4ZM2 16H6V14H2V16Z" fill="#191C1E"/>
        </svg>
        <span>الذهاب إلى لوحة التحكم</span>
      </a>
    </div>

    <div class="fp-success-card__security-note">
      <div class="fp-success-card__security-inner">
        <span>اتصال آمن بنسبة 100% ومحمي تقنياً</span>
        <svg width="12" height="15" viewBox="0 0 12 15" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5.2125 10.1625L9.45 5.925L8.38125 4.85625L5.2125 8.025L3.6375 6.45L2.56875 7.51875L5.2125 10.1625ZM6 15C4.2625 14.5625 2.82812 13.5656 1.69687 12.0094C0.565625 10.4531 0 8.725 0 6.825V2.25L6 0L12 2.25V6.825C12 8.725 11.4344 10.4531 10.3031 12.0094C9.17188 13.5656 7.7375 14.5625 6 15ZM6 13.425C7.3 13.0125 8.375 12.1875 9.225 10.95C10.075 9.7125 10.5 8.3375 10.5 6.825V3.28125L6 1.59375L1.5 3.28125V6.825C1.5 8.3375 1.925 9.7125 2.775 10.95C3.625 12.1875 4.7 13.0125 6 13.425Z" fill="#434655" fill-opacity="0.6"/>
        </svg>
      </div>
    </div>

    <a routerLink="/help-center" class="fp-success-card__contextual-link">هل تواجه مشكلة في تسجيل الدخول؟</a>
  </div>
</main>
