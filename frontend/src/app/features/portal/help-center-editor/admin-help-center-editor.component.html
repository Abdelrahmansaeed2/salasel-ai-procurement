<div class="editor-container" dir="rtl">
  <div class="header">
    <div>
      <h2 class="title">إدارة مركز المساعدة</h2>
      <p class="subtitle">قم بكتابة مقالات تعليمية لمساعدة الموردين والمتاجر على استخدام النظام</p>
    </div>
    <button class="btn-primary" [disabled]="!articleTitle().trim() || !articleContent().trim() || isSaving()" (click)="saveArticle()">
      <span *ngIf="isSaving()" class="spinner"></span>
      <span *ngIf="!isSaving()">نشر المقال</span>
    </button>
  </div>

  <div class="editor-card">
    <div class="form-group">
      <label for="title">عنوان المقال</label>
      <input 
        id="title" 
        type="text" 
        class="form-control" 
        placeholder="مثال: كيف تدير الكتالوج الخاص بك بفعالية؟" 
        [ngModel]="articleTitle()"
        (ngModelChange)="articleTitle.set($event)"
      />
    </div>

    <div class="form-group">
      <label for="content">محتوى المقال</label>
      <textarea 
        id="content" 
        class="form-control editor-textarea" 
        placeholder="اكتب تفاصيل المقال هنا... يمكنك استخدام المسافات والفقرات لتنظيم المحتوى."
        [ngModel]="articleContent()"
        (ngModelChange)="articleContent.set($event)"
      ></textarea>
    </div>
  </div>
</div>
