<div class="support-card">
  <div class="support-card__header">
    <svg class="support-card__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      <path d="M12 8v4m0 4h.01"/>
    </svg>
    <h3 class="support-card__title">تحتاج إلى مساعدة؟</h3>
  </div>

  <p class="support-card__body">
    فريق الدعم الفني متاح على مدار الساعة للإجابة على استفساراتكم.
  </p>

  <button type="button" class="support-card__link" (click)="onContactSupport()">
    <span>تواصل مع الدعم الفني</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="external-icon">
      <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
      <polyline points="15 3 21 3 21 9"/>
      <line x1="10" y1="14" x2="21" y2="3"/>
    </svg>
  </button>
</div>
